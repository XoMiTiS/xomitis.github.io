name: Deploy portfolio

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install portfolio dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Install Forma dependencies
        working-directory: projects/forma
        run: npm ci

      - name: Build Forma
        working-directory: projects/forma
        run: npm run build

      - name: Add Forma
        run: |
          mkdir -p dist/forma
          cp -r projects/forma/dist/. dist/forma/

      - name: Install Pulse dependencies
        working-directory: projects/pulse
        run: npm ci

      - name: Build Pulse
        working-directory: projects/pulse
        run: npm run build

      - name: Add Pulse
        run: |
          mkdir -p dist/pulse
          cp -r projects/pulse/dist/. dist/pulse/

      - name: Install Zerna dependencies
        working-directory: projects/zerna
        run: npm ci

      - name: Build Zerna
        working-directory: projects/zerna
        run: npm run build

      - name: Add Zerna
        run: |
          mkdir -p dist/zerna
          cp -r projects/zerna/dist/. dist/zerna/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4